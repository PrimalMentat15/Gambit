; update_epochs=2 A/B fork on GPU 1 of the 2x5090 box. Kill via
; `supervisorctl stop balatro-m5b` + remove this file once the A/B is decided.
[program:balatro-m5b]
command=/workspace/balatroagent/tools/cloud/run_training.sh
directory=/workspace/balatroagent/train
environment=TRAIN_CONFIG="configs/m5b.yaml",RUN_NAME="m5b",CUDA_VISIBLE_DEVICES="0"
autostart=true
autorestart=true
startretries=3
startsecs=60
stopwaitsecs=30
stdout_logfile=/workspace/balatroagent/train/runs/m5b/train.log
stdout_logfile_maxbytes=200MB
redirect_stderr=true
