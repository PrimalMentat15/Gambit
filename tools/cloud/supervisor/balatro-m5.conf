; Main run on GPU 0 of the 2x5090 box. Install: cp to /etc/supervisor/conf.d/
; then `supervisorctl reread && supervisorctl update`.
[program:balatro-m5]
command=/workspace/balatroagent/tools/cloud/run_training.sh
directory=/workspace/balatroagent/train
environment=TRAIN_CONFIG="configs/m5.yaml",RUN_NAME="m5",CUDA_VISIBLE_DEVICES="0"
autostart=true
autorestart=true
startretries=3
startsecs=60
stopwaitsecs=30
stdout_logfile=/workspace/balatroagent/train/runs/m5/train.log
stdout_logfile_maxbytes=200MB
redirect_stderr=true
