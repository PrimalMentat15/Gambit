; update_epochs=2 A/B fork on GPU 1 of the 2x5090 box. Kill via
; `supervisorctl stop balatro-m5e2` + remove this file once the A/B is decided.
[program:balatro-m5e2]
command=/workspace/balatroagent/tools/cloud/run_training.sh
directory=/workspace/balatroagent/train
environment=TRAIN_CONFIG="configs/m5e2.yaml",RUN_NAME="m5e2",CUDA_VISIBLE_DEVICES="1"
autostart=true
autorestart=true
startretries=3
startsecs=60
stopwaitsecs=30
stdout_logfile=/workspace/balatroagent/train/runs/m5e2/train.log
stdout_logfile_maxbytes=200MB
redirect_stderr=true
