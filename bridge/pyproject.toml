[project]
name = "balatro-bridge"
version = "0.1.0"
description = "Thin typed bridge to the balatrobot JSON-RPC API for the real Balatro game (Steam/Proton)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  # Upstream CLI + generic JSON-RPC client (coder/balatrobot, MIT).
  # Pinned to the same release as the installed Lua mod in
  # ~/.local/share/Balatro/Mods/balatrobot (tag v1.5.2).
  "balatrobot>=1.5.2,<1.6",
]

[project.optional-dependencies]
# These extras and the [tool.uv.sources] entries below only resolve under uv.
# In the conda env, balatro-sim and balatro-train are installed directly
# (`pip install ./sim/py` and `pip install -e train`), so the extras are not
# used -- `pip install -e bridge` on its own is enough.
#
# sim  = the Rust PyO3 module, needed by the cross-validation harness.
# demo = sim + the trained policy/encoding, for balatro-bridge-demo.
sim = ["balatro-sim"]
demo = ["balatro-sim", "balatro-train"]

[tool.uv.sources]
balatro-sim = { path = "../sim/py" }
balatro-train = { path = "../train" }

[project.scripts]
balatro-bridge-launch = "balatro_bridge.launch:main"
balatro-bridge-smoke = "balatro_bridge.smoke:main"
balatro-bridge-demo = "balatro_bridge.demo:main"
balatro-bridge-autoplay = "balatro_bridge.autoplay:main"
balatro-crossval = "balatro_bridge.crossval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balatro_bridge"]
