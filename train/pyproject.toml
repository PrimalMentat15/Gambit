[project]
name = "balatro-train"
version = "0.1.0"
description = "PPO training stack for the Balatro RL agent (phase P6+)"
requires-python = ">=3.11"
dependencies = [
    # NOTE: install torch FIRST, from the CUDA index, before installing this
    # package. On Linux the default PyPI wheel is CUDA-enabled, but on Windows
    # it is CPU-only -- so resolving "torch" from PyPI here silently costs you
    # the GPU. The repo README's Environment section has the exact command.
    "torch>=2.4",
    "numpy>=1.26",
    "tensorboard>=2.16",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The Rust PyO3 vec-env (sim/py). The extra and the [tool.uv.sources] entry
# below only resolve under uv; in the conda env it is installed directly:
#   pip install ./sim/py
# and after Rust changes:
#   pip install --force-reinstall --no-deps ./sim/py
sim = ["balatro-sim"]

[tool.uv.sources]
balatro-sim = { path = "../sim/py" }

# Not installed by `pip install -e .` (pip does not read dependency-groups).
# The conda env gets these explicitly; see the repo README.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "maturin>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balatro_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
