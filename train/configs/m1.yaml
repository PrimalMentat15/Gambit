# M1: first real training run — full-size policy on the Rust vec-env, with
# the ante-limit curriculum (1 -> 2 -> 3 -> 5 -> 8, promote at 70% argmax
# win-rate on a held-out seed block).
#
# Launch (detached):
#   cd train && mkdir -p runs/m1
#   nohup python -m balatro_train.ppo --config configs/m1.yaml \
#       > runs/m1/train.log 2>&1 &  echo $! > runs/m1/pid
# Monitor:  uv run tensorboard --logdir runs/
#
# TB events AND checkpoints both land in runs/m1/ (gitignored).
seed: 1
device: cuda
bf16_rollout: true

env:
  name: sim
  num_envs: 2048
  seed: 0

policy:
  d_model: 128
  n_layers: 3
  n_heads: 4
  ffn_mult: 4
  global_hidden: 256
  value_hidden: 256

ppo:
  total_timesteps: 1000000000
  rollout_len: 128          # 2048 x 128 = 262,144 transitions / iter
  # Plan said 32768, but fp32 update activations OOM the 12GB RTX 4070
  # (measured 2026-07-16: >10.3GB at mb 32k AND at mb 16k — torch's
  # transformer takes the unfused attention path here). 8192 x 4 epochs
  # sees the same data with 4x the gradient steps.
  minibatch_size: 8192
  update_epochs: 4
  gamma: 0.999
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  lr: 3.0e-4
  anneal_lr: true           # linear to 0 over total_timesteps
  max_grad_norm: 0.5
  norm_adv: true
  norm_ret: true

curriculum:
  enabled: true
  start_ante: 1
  ladder: [1, 2, 3, 5, 8]
  promote_winrate: 0.7
  eval_every_steps: 2000000        # cheap promotion eval (argmax, held-out)
  promotion_eval_episodes: 200
  eval_num_envs: 100
  eval_seed_base: 1000000
  milestone_every_steps: 25000000  # full-game (win_ante 8) M-milestone eval
  milestone_episodes: 200

log:
  run_name: m1
  log_dir: runs
  ckpt_dir: runs            # ckpt_dir/run_name == runs/m1 (next to TB events)
  save_every_iters: 20      # ~5.2M steps per checkpoint
  log_every_iters: 1
  tensorboard: true
  wandb: false
