# M5 epochs A/B (GPU 1 of the 2x5090 box): identical to m5.yaml except
# ppo.update_epochs 4 -> 2 — the throughput investigation's biggest lever
# (~1.8x steps/s; update is 85% of wall time and linear in epochs) but it
# halves gradient steps per sample. Forked from the same checkpoint as m5;
# compare ante-8 win-rate slope per WALL-HOUR (TB: eval/* + curriculum/*),
# then keep the winner and kill the loser.

seed: 1
device: cuda
bf16_rollout: true

env:
  name: sim
  num_envs: 4096
  seed: 0

policy:
  d_model: 128
  n_layers: 3
  n_heads: 4
  ffn_mult: 4
  global_hidden: 256
  value_hidden: 256

ppo:
  total_timesteps: 4000000000
  rollout_len: 128
  minibatch_size: 32768
  update_epochs: 2
  gamma: 0.999
  gae_lambda: 0.95
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  lr: 3.0e-4
  anneal_lr: true
  max_grad_norm: 0.5
  norm_adv: true
  norm_ret: true

perf:
  bf16_update: true
  compile: true
  buffer_device: cuda
  pin_memory: true
  auto_minibatch: true
  fused_adam: true

curriculum:
  enabled: true
  start_ante: 1
  ladder: [1, 2, 3, 5, 8]
  promote_winrate: 0.7
  eval_every_steps: 4000000
  promotion_eval_episodes: 200
  eval_num_envs: 100
  eval_seed_base: 1000000
  milestone_every_steps: 25000000
  milestone_episodes: 200

snapshots:
  enabled: true
  pool_path: runs/pools/pool_v1.bin
  fraction: 0.3
  anneal:
    start_step: 600000000
    end_step: 900000000
    final_fraction: 0.0

shaping:
  beta: 1.0
  anneal:
    start_step: 500000000
    end_step: 900000000
    final_beta: 0.1

log:
  run_name: m5e2
  log_dir: runs
  ckpt_dir: runs
  save_every_iters: 20
  log_every_iters: 1
  tensorboard: true
  wandb: false
